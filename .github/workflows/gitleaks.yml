# Recherche de secrets (Gitleaks) — ajouté et maintenu par gitleaks-ci-sync.
# Ne pas supprimer : il sera remis automatiquement. Détails : https://github.com/DevRedious/gitleaks-ci
name: Gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    uses: DevRedious/gitleaks-ci/.github/workflows/gitleaks.yml@v1
    with:
      historique-complet: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
